<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Walmart Realty — Laptop Sticker QR</title>

  <!--
    qrcode-generator: pure-JS QR matrix library (no canvas, just the module grid).
    We use it to get isDark(row,col) and then paint every pixel ourselves.
    MIT-licensed, tiny (12 KB), no dependencies.
  -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

  <style>
    :root {
      --blue:   #0053e2;
      --yellow: #ffc220;
      --dark:   #001a5e;
    }

    /* Walmart Everyday Sans — official brand typeface (w/ Bogle fallback) */
    @font-face {
      font-family: 'EverydaySans';
      src: url('https://i5.walmartimages.com/dfw/63fd9f59-e0d6/ee4d4aa3-7cd5-4e26-9b5a-e23cb52ef82f/v1/EverydaySans-Regular.woff2') format('woff2'),
           url('https://i5.walmartimages.com/dfw/63fd9f59-e0d6/636a849e-a3cf-43c3-8464-14b89abef7be/v1/Bogle-Regular.woff2') format('woff2');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'EverydaySans';
      src: url('https://i5.walmartimages.com/dfw/63fd9f59-e0d6/ee4d4aa3-7cd5-4e26-9b5a-e23cb52ef82f/v1/EverydaySans-Bold.woff2') format('woff2'),
           url('https://i5.walmartimages.com/dfw/63fd9f59-e0d6/636a849e-a3cf-43c3-8464-14b89abef7be/v1/Bogle-Bold.woff2') format('woff2');
      font-weight: 700 800; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Bogle';
      src: url('https://i5.walmartimages.com/dfw/63fd9f59-e0d6/636a849e-a3cf-43c3-8464-14b89abef7be/v1/Bogle-Regular.woff2') format('woff2');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Bogle';
      src: url('https://i5.walmartimages.com/dfw/63fd9f59-e0d6/636a849e-a3cf-43c3-8464-14b89abef7be/v1/Bogle-Bold.woff2') format('woff2');
      font-weight: 700 800; font-style: normal; font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 32px 16px;
      background: #0f1929;
      font-family: 'EverydaySans', 'Bogle', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    h1 {
      color: #fff;
      font-family: 'EverydaySans', 'Bogle', -apple-system, sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: .7;
    }

    canvas {
      border-radius: 24px;
      /* crisp downscale for retina — we render @2× then display @1× */
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      max-width: min(100vw - 32px, 520px);
      height: auto;
      display: block;
      box-shadow:
        0 0 0 3px var(--yellow),
        0 0 40px 6px rgba(0, 83, 226, .55),
        0 24px 64px rgba(0,0,0,.7);
    }

    .btn-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 12px;
      font-family: 'EverydaySans', 'Bogle', -apple-system, sans-serif;
      font-size: .9rem;
      font-weight: 700;
      padding: 12px 28px;
      transition: transform .12s, opacity .12s;
    }
    button:hover { opacity: .88; transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .btn-download {
      background: var(--yellow);
      color: #001a5e;
    }
    .btn-print {
      background: var(--blue);
      color: #fff;
    }

    footer {
      font-family: 'EverydaySans', 'Bogle', -apple-system, sans-serif;
      color: rgba(255,255,255,.3);
      font-size: .72rem;
      letter-spacing: .04em;
    }
  </style>
</head>
<body>

  <h1>🖥️ Walmart Realty — Laptop Sticker</h1>

  <canvas id="sticker" width="1040" height="1040"></canvas>

  <div class="btn-row">
    <button class="btn-download" id="dl-btn">⬇️ Download PNG</button>
    <button class="btn-print" onclick="window.print()">🖨️ Print</button>
  </div>

  <script>
  (() => {
    /* ─── palette ─────────────────────────────────────────────────── */
    const BLUE      = '#0053e2';
    const BLUE_DARK = '#001a5e';
    const YELLOW    = '#ffc220';
    const WHITE     = '#ffffff';

    /* ─── font stack (Everyday Sans → Bogle → system) ────────────── */
    const FONT = "'EverydaySans', 'Bogle', -apple-system, BlinkMacSystemFont, sans-serif";

    /* ─── target URL ──────────────────────────────────────────────── */
    const URL = 'https://walmartrealty.github.io/Walmart-Realty/';

    /* ─── generate QR matrix (level H = up to 30% recoverable) ───── */
    const qr = qrcode(0, 'H');
    qr.addData(URL);
    qr.make();
    const N = qr.getModuleCount();

    /* ─── canvas ──────────────────────────────────────────────────── */
    const canvas = document.getElementById('sticker');
    const W = canvas.width;   // 1040 px
    const ctx = canvas.getContext('2d');

    /* ─── layout ──────────────────────────────────────────────────── */
    const CORNER_R = 48;
    const HDR_H    = 148;
    const FTR_H    = 80;
    const PAD      = 56;
    const TOTAL_H  = W;
    const QR_CELL  = (TOTAL_H - HDR_H - FTR_H - PAD * 2) / N;
    const QR_SZ    = QR_CELL * N;
    const QR_OX    = (W - QR_SZ) / 2;
    const QR_OY    = HDR_H + PAD;

    /* ─── helper: rounded rect path ──────────────────────────────── */
    const roundRect = (cx, cy, cw, ch, cr) => {
      ctx.beginPath();
      ctx.moveTo(cx + cr, cy);
      ctx.lineTo(cx + cw - cr, cy);
      ctx.arcTo(cx + cw, cy,      cx + cw, cy + cr,      cr);
      ctx.lineTo(cx + cw, cy + ch - cr);
      ctx.arcTo(cx + cw, cy + ch, cx + cw - cr, cy + ch, cr);
      ctx.lineTo(cx + cr, cy + ch);
      ctx.arcTo(cx,       cy + ch, cx,           cy + ch - cr, cr);
      ctx.lineTo(cx, cy + cr);
      ctx.arcTo(cx,       cy,      cx + cr,      cy,      cr);
      ctx.closePath();
    };

    /* ─── main draw (called after fonts + spark image are ready) ─── */
    const drawAll = (sparkImg) => {

      /* ════════════════════════════════════════════════════════════
         1. CARD BACKGROUND
      ════════════════════════════════════════════════════════════ */
      ctx.save();
      roundRect(0, 0, W, TOTAL_H, CORNER_R);
      ctx.clip();
      const glow = ctx.createRadialGradient(W/2, TOTAL_H/2, 0, W/2, TOTAL_H/2, W * .65);
      glow.addColorStop(0,   '#0a2a6e');
      glow.addColorStop(.55, '#071540');
      glow.addColorStop(1,   '#030c26');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, W, TOTAL_H);
      ctx.restore();

      /* ════════════════════════════════════════════════════════════
         2. HEADER — yellow accent bar + WALMART REALTY text
      ════════════════════════════════════════════════════════════ */
      ctx.fillStyle = YELLOW;
      ctx.fillRect(0, 0, W, 8);

      ctx.save();
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';

      ctx.fillStyle    = WHITE;
      ctx.font         = `800 ${W * .082}px ${FONT}`;
      ctx.letterSpacing = `${W * .018}px`;
      ctx.fillText('WALMART', W / 2, 56);

      ctx.fillStyle    = YELLOW;
      ctx.font         = `700 ${W * .052}px ${FONT}`;
      ctx.letterSpacing = `${W * .022}px`;
      ctx.fillText('REALTY', W / 2, 108);
      ctx.restore();

      /* ════════════════════════════════════════════════════════════
         3. WHITE QR PANEL + yellow glow ring
      ════════════════════════════════════════════════════════════ */
      const PANEL_PAD = 28;
      const PX = QR_OX - PANEL_PAD;
      const PY = QR_OY - PANEL_PAD;
      const PW = QR_SZ + PANEL_PAD * 2;
      const PH = QR_SZ + PANEL_PAD * 2;

      ctx.save();
      ctx.shadowColor = YELLOW;
      ctx.shadowBlur  = 28;
      roundRect(PX - 4, PY - 4, PW + 8, PH + 8, 20);
      ctx.fillStyle = YELLOW;
      ctx.fill();
      ctx.restore();

      ctx.save();
      roundRect(PX, PY, PW, PH, 16);
      ctx.fillStyle = WHITE;
      ctx.fill();
      ctx.restore();

      /* ════════════════════════════════════════════════════════════
         4. QR MODULES — rounded pebble, Walmart Blue
      ════════════════════════════════════════════════════════════ */
      const inFinder = (r, c) =>
        (r < 8 && c < 8) || (r < 8 && c >= N - 8) || (r >= N - 8 && c < 8);

      const modRadius = QR_CELL * .42;

      const drawModule = (col, row, color) => {
        const x   = QR_OX + col * QR_CELL;
        const y   = QR_OY + row * QR_CELL;
        const pad = QR_CELL * .1;
        const s   = QR_CELL - pad * 2;
        const rr  = Math.min(modRadius, s / 2);
        roundRect(x + pad, y + pad, s, s, rr);
        ctx.fillStyle = color;
        ctx.fill();
      };

      for (let row = 0; row < N; row++) {
        for (let col = 0; col < N; col++) {
          if (!inFinder(row, col) && qr.isDark(row, col))
            drawModule(col, row, BLUE);
        }
      }

      /* ════════════════════════════════════════════════════════════
         5. FINDER PATTERNS — concentric rounded squares
      ════════════════════════════════════════════════════════════ */
      const drawFinder = (originCol, originRow) => {
        const ox = QR_OX + originCol * QR_CELL;
        const oy = QR_OY + originRow * QR_CELL;
        const sz = QR_CELL;
        const OUTER = 7 * sz;

        roundRect(ox, oy, OUTER, OUTER, sz * .55);
        ctx.fillStyle = BLUE_DARK; ctx.fill();

        const YPAD = sz * .18;
        roundRect(ox + YPAD, oy + YPAD, OUTER - YPAD*2, OUTER - YPAD*2, sz * .45);
        ctx.fillStyle = YELLOW; ctx.fill();

        const WP = sz * .9;
        roundRect(ox + WP, oy + WP, OUTER - WP*2, OUTER - WP*2, sz * .35);
        ctx.fillStyle = WHITE; ctx.fill();

        const IP = sz * 2;
        roundRect(ox + IP, oy + IP, sz * 3, sz * 3, sz * .55);
        ctx.fillStyle = BLUE; ctx.fill();

        ctx.beginPath();
        ctx.arc(ox + sz * 2.5, oy + sz * 2.5, sz * .38, 0, Math.PI * 2);
        ctx.fillStyle = YELLOW; ctx.fill();
      };

      drawFinder(0,     0    );
      drawFinder(N - 7, 0    );
      drawFinder(0,     N - 7);

      /* ════════════════════════════════════════════════════════════
         6. OFFICIAL WALMART SPARK — drawn from spark-logo.png
            Level-H QR allows ~30% damage, so covering the centre
            (~10%) is perfectly safe for scannability.
      ════════════════════════════════════════════════════════════ */
      const CX     = QR_OX + QR_SZ / 2;
      const CY     = QR_OY + QR_SZ / 2;
      const DISC_R = QR_CELL * 3.6;
      const SPARK  = DISC_R * 2 * 0.92;  // image draw size (slightly inside disc)

      // white backing disc with glow
      ctx.save();
      ctx.shadowColor = 'rgba(255,194,32,.4)';
      ctx.shadowBlur  = 28;
      ctx.beginPath();
      ctx.arc(CX, CY, DISC_R, 0, Math.PI * 2);
      ctx.fillStyle = WHITE;
      ctx.fill();
      ctx.restore();

      // yellow ring border
      ctx.beginPath();
      ctx.arc(CX, CY, DISC_R, 0, Math.PI * 2);
      ctx.strokeStyle = YELLOW;
      ctx.lineWidth   = QR_CELL * .2;
      ctx.stroke();

      // draw the official Walmart spark PNG, clipped to the white disc
      ctx.save();
      ctx.beginPath();
      ctx.arc(CX, CY, DISC_R - 2, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(
        sparkImg,
        CX - SPARK / 2,
        CY - SPARK / 2,
        SPARK,
        SPARK
      );
      ctx.restore();

      /* ════════════════════════════════════════════════════════════
         7. FOOTER — "scan to browse available properties" (white)
      ════════════════════════════════════════════════════════════ */
      const FY = QR_OY + QR_SZ + PANEL_PAD + (TOTAL_H - (QR_OY + QR_SZ + PANEL_PAD) - 8) / 2;

      ctx.save();
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle    = WHITE;
      ctx.font         = `700 ${W * .032}px ${FONT}`;
      ctx.letterSpacing = '0.12em';
      ctx.fillText('SCAN TO BROWSE AVAILABLE PROPERTIES', W / 2, FY);
      ctx.restore();

      // bottom yellow accent bar
      ctx.fillStyle = YELLOW;
      ctx.fillRect(0, TOTAL_H - 8, W, 8);

    }; // end drawAll

    /* ─── load official spark PNG, wait for fonts, then render ───── */
    const sparkImg = new Image();
    sparkImg.src = "spark-logo.png";

    Promise.all([
      document.fonts.ready,
      new Promise((resolve, reject) => {
        sparkImg.onload  = resolve;
        sparkImg.onerror = resolve;   // graceful: render even if image fails
      })
    ]).then(() => {
      drawAll(sparkImg);
    });

    /* ─── download button ─────────────────────────────────────────── */
    document.getElementById('dl-btn').addEventListener('click', () => {
      const a = document.createElement('a');
      a.download = 'walmart-realty-sticker.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    });

  })();
  </script>
</body>
</html>
